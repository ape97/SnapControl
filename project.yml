name: SnapControl
options:
  bundleIdPrefix: io.github.ape97
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.4.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
targets:
  SnapControl:
    type: application
    platform: macOS
    sources:
      - path: SnapControl
    info:
      path: SnapControl/Resources/Info.plist
      properties:
        CFBundleName: Snap Control
        CFBundleDisplayName: Snap Control
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: © 2026 ape97
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ape97.snapcontrol
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
